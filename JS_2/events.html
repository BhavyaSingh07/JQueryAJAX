<!DOCTYPE html>
<html>
    <head>
        <title>Events in JS</title>
    </head>
    <body>
        <!-- using inline event handler-->
         <button id="inlineEventHandlerButton" type="button" onclick="displayMsg()">Uses inline event handler</button>
         <p id="paragraph"></p>

         <!-- using event handler properties-->
         <button id="eventHandlerButton" type="button">User Event Handler Properties</button>

         <!--using event listeners-->
         <button id="eventListenerButton" type="button">Using Event Listener</button>

        <script>
            //inline event handler
            function displayMsg(){
                document.getElementById("paragraph").innerHTML = "Hello from JS";
            }

            //using event handler properties
            const eventHandlerbutton = document.getElementById("eventHandlerButton");
            eventHandlerbutton.onclick = function(){
                alert("Event handler property button clicked");
            }

            //using event listener
            const eventListenerbutton = document.getElementById("eventListenerButton");
            eventListenerbutton.addEventListener('click', function(event){
                      console.log(event);
                      alert("Event listener button clicked"); 
            })
        </script>
    </body>
</html>
